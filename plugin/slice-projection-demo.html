<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画切片水平投影候选线 Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf3ff;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{padding:18px 24px;background:#101a2d;border-bottom:1px solid #283650;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0 0 3px}header p{margin:0;color:#9ba9c2}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;padding:14px;max-width:1800px;margin:auto}.side{background:#131b2d;border:1px solid #283650;border-radius:12px;padding:14px;align-self:start}.side h2{font-size:13px;margin:4px 0 10px;color:#bcd0ef}.field{margin:11px 0}.field label{display:flex;justify-content:space-between;color:#c2cee2;margin-bottom:5px}.field input[type=number],.field select{width:100%;padding:8px;background:#0c1424;color:#fff;border:1px solid #30415c;border-radius:7px}.field input[type=range]{width:100%;accent-color:#48d7df}button,.upload{width:100%;display:block;text-align:center;border:1px solid #36506e;border-radius:8px;padding:9px;background:#1a2940;color:white;font-weight:650;cursor:pointer}.upload{border-style:dashed;margin:5px 0 9px}.primary{background:#078591;border-color:#20a6ad}.stats{background:#0c1424;color:#c6d5e9;border-radius:8px;padding:9px;font-size:12px;margin-top:9px}.hint{font-size:11px;color:#94a6c1}.side hr{border:0;border-top:1px solid #283650;margin:15px 0}.main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:14px;align-items:start}.column{min-width:0;display:flex;flex-direction:column;gap:12px}.card{background:#111a2b;border:1px solid #283650;border-radius:11px;overflow:hidden}.cardhead{padding:9px 12px;border-bottom:1px solid #283650;font-weight:700;display:flex;justify-content:space-between}.cardhead small{font-weight:400;color:#9ba9c2}.scroll{max-height:80vh;overflow:auto;padding:10px;background:#0b1322;position:relative}.scroll canvas{display:block;max-width:100%;height:auto;margin:auto}.placeholder{padding:40px 10px;text-align:center;color:#8698b3}.image-wrap{position:relative;width:max-content;max-width:100%;margin:auto}.image-wrap canvas{display:block;max-width:100%;height:auto}.outcanvas{max-width:100%;height:auto;display:block;margin:auto}.projectionwrap{padding:12px}.projection{width:100%;height:300px;background:#0a1220;border:1px solid #2a3a52;border-radius:7px}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;color:#aebdd3;font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
@media(max-width:1000px){main{grid-template-columns:260px 1fr}.main{grid-template-columns:1fr}}@media(max-width:650px){main{display:flex;flex-direction:column;padding:8px}.side{width:100%}.scroll{max-height:65vh}}
</style></head><body>
<header><h1>水平投影候选切线 Demo</h1><p>Otsu 二值化 → 逐行统计前景像素 → 在 H₀ ± R 内寻找低投影候选谷底</p></header>
<main><aside class="side">
<h2>图片与拼接</h2><label class="upload" for="files">选择多张图片</label><input id="files" type="file" accept="image/*" multiple hidden>
<div class="field"><label>拼接宽度 W</label><input id="width" type="number" value="720" min="1"></div>
<div class="field"><label>顺序</label><select id="order"><option value="name">按文件名数字排序</option><option value="select">按选择顺序</option></select></div><button id="build">拼接 / 更新</button><div id="imgstats" class="stats">等待图片</div>
<hr><h2>搜索范围与切线参数</h2>
<div class="field"><label>H₀ 系数 × W</label><input id="factor" type="number" value="3.46" step=".01"></div>
<div class="field"><label>R = W^指数 × 倍率</label><div style="display:flex;gap:7px"><input id="exp" type="number" value=".86" step=".01"><input id="mult" type="number" value="1" step=".05"></div><small class="hint">指数 / 半径倍率</small></div>
<div class="field"><label>目标中心 y <span id="targetLabel">—</span></label><input id="target" type="range" min="0" max="100"></div>
<div class="field"><label>投影平滑窗口 <span id="smoothLabel">9</span> 行</label><input id="smooth" type="range" min="1" max="61" step="2" value="9"></div>
<div class="field"><label>候选线最小间隔 <span id="gapLabel">50</span> px</label><input id="gap" type="range" min="5" max="240" value="50"></div>
<div class="field"><label>显示候选数量 <span id="countLabel">8</span></label><input id="count" type="range" min="1" max="20" value="8"></div>
<button id="analyze" class="primary">运行水平投影分析</button>
<div id="stats" class="stats">拼接图片后运行分析</div>
<div class="hint" style="margin-top:9px">候选线只是低前景投影的谷底，不代表已验证不会切中文字。红线为理论中心，黄线为低投影候选。</div>
</aside>
<section class="main">
<div class="column"><div class="card"><div class="cardhead">拼接原图与候选线 <small id="meta">等待图片</small></div><div class="scroll" id="origscroll"><div id="imagewrap" class="image-wrap"><div class="placeholder" id="empty">选择图片后会显示拼接长图</div><canvas id="original" hidden></canvas><canvas id="overlay" hidden style="position:absolute;left:0;top:0;pointer-events:none"></canvas></div></div><div class="legend"><span><i class="dot" style="background:#ff5364"></i>理论切线中心</span><span><i class="dot" style="background:#ffc34d"></i>候选低谷</span><span><i class="dot" style="background:#ff536455"></i>搜索范围</span></div></div></div>
<div class="column">
<div class="card"><div class="cardhead">搜索区域（灰度）<small id="grayMeta">—</small></div><div class="scroll"><canvas id="grayCanvas" class="outcanvas"></canvas></div></div>
<div class="card"><div class="cardhead">Otsu 二值化<small id="otsuMeta">—</small></div><div class="scroll"><canvas id="binaryCanvas" class="outcanvas"></canvas></div></div>
<div class="card"><div class="cardhead">水平投影直方图<small>每行黑色像素比例</small></div><div class="projectionwrap"><canvas id="projection" class="projection"></canvas></div></div>
</div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);let pics=[],full=null,grayAll=null,bandStart=0,candidates=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),original=$("original"),overlay=$("overlay");
$("files").onchange=async e=>{pics=[];for(const f of e.target.files){try{pics.push({f,b:await createImageBitmap(f)})}catch{}}$("imgstats").textContent="已载入 "+pics.length+" 张";build()};
$("build").onclick=build;$("order").onchange=build;$("width").onchange=build;$("analyze").onclick=analyze;
for(const id of ["factor","exp","mult","target","smooth","gap","count"])$(id).addEventListener("input",()=>{if(id==="target")$("target").dataset.manual="1";labels();if(full)analyze()});
function build(){if(!pics.length)return;const W=Math.max(1,+$("width").value||720),list=[...pics];if($("order").value==="name")list.sort((a,b)=>a.f.name.localeCompare(b.f.name,undefined,{numeric:true,sensitivity:"base"}));let H=0;const hs=list.map(x=>{const h=Math.round(x.b.height*W/x.b.width);H+=h;return h});original.width=W;original.height=H;const c=original.getContext("2d",{willReadFrequently:true});let y=0;list.forEach((x,i)=>{c.drawImage(x.b,0,y,W,hs[i]);y+=hs[i]});full=c.getImageData(0,0,W,H);grayAll=gray(full);original.hidden=false;$("overlay").hidden=false;$("empty").hidden=true;$("target").max=H-1;$("target").value=Math.min(H-1,Math.round(W*(+$("factor").value||3.46)));$("target").dataset.manual="";$("imgstats").innerHTML="<b>"+list.length+"</b> 张 · "+W+" × "+H+" px<br>"+list.map((x,i)=>(i+1)+". "+x.f.name).join("<br>");$("meta").textContent=W+"×"+H+" px";labels();drawOriginal();analyze()}
function labels(){if(!full)return;const W=full.width,H=full.height,R=Math.pow(W,+$("exp").value||.86)*(+$("mult").value||0),center=$("target").dataset.manual?(+$("target").value):Math.min(H-1,Math.round(W*(+$("factor").value||3.46)));$("target").value=center;$("targetLabel").textContent=center+" px";$("smoothLabel").textContent=$("smooth").value;$("gapLabel").textContent=$("gap").value;$("countLabel").textContent=$("count").value;$("stats").innerHTML="H₀ = <b>"+((+$("factor").value||3.46)*W).toFixed(1)+" px</b><br>候选搜索范围：<b>"+Math.max(0,Math.round(center-R))+" – "+Math.min(H-1,Math.round(center+R))+" px</b><br>当前中心：y="+center+"；半径："+R.toFixed(1)+" px"}
function drawOriginal(){if(!full)return;labels();const W=full.width,H=full.height,R=Math.pow(W,+$("exp").value||.86)*(+$("mult").value||0),center=+$("target").value;overlay.width=original.width;overlay.height=original.height;overlay.style.width=original.clientWidth+"px";overlay.style.height=original.clientHeight+"px";const c=overlay.getContext("2d");c.clearRect(0,0,overlay.width,overlay.height);const top=clamp(center-R,0,H),bot=clamp(center+R,0,H);c.fillStyle="rgba(255,65,80,.19)";c.fillRect(0,top,W,bot-top);c.strokeStyle="#ff5364";c.lineWidth=Math.max(2,W/500);c.beginPath();c.moveTo(0,center);c.lineTo(W,center);c.stroke();for(const y of candidates){c.strokeStyle="#ffc34d";c.lineWidth=Math.max(2,W/600);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}
function gray(im){const d=im.data,g=new Uint8Array(im.width*im.height);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=Math.round(.299*d[j]+.587*d[j+1]+.114*d[j+2]);return g}
function otsu(g){const h=new Uint32Array(256);for(const v of g)h[v]++;let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];let wb=0,sb=0,best=-1,t=128,n=g.length;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];const d=sb/wb-(sum-sb)/wf,s=wb*wf*d*d;if(s>best){best=s;t=i}}return t}
function analyze(){if(!full)return;labels();const W=full.width,H=full.height,center=+$("target").value,R=Math.pow(W,+$("exp").value||.86)*(+$("mult").value||0),y0=Math.max(0,Math.floor(center-R)),y1=Math.min(H,Math.ceil(center+R)),bh=Math.max(1,y1-y0);bandStart=y0;const vals=new Uint8Array(W*bh);for(let y=0;y<bh;y++)vals.set(grayAll.subarray((y0+y)*W,(y0+y+1)*W),y*W);drawGray(W,bh,vals);const t=otsu(vals),bin=new Uint8Array(vals.length);for(let i=0;i<vals.length;i++)bin[i]=vals[i]<t?0:255;drawBinary(W,bh,bin);const projection=new Float32Array(bh);for(let y=0;y<bh;y++){let n=0,row=y*W;for(let x=0;x<W;x++)if(bin[row+x]===0)n++;projection[y]=n/W}const smooth=boxSmooth(projection,+$("smooth").value),top=Math.max(0,Math.ceil(center-R)-y0),bottom=Math.min(bh-1,Math.floor(center+R)-y0);candidates=findCandidates(smooth,top,bottom,+$("gap").value,+$("count").value);drawProjection(smooth,top,bottom,center-y0,y0);drawOriginal();$("otsuMeta").textContent="阈值 T="+t+" · 前景=黑像素";$("grayMeta").textContent="y "+y0+"–"+y1+" · "+W+"×"+bh;$("stats").innerHTML="H₀ = <b>"+((+$("factor").value||3.46)*W).toFixed(1)+" px</b><br>搜索范围：<b>"+y0+" – "+y1+" px</b><br>Otsu 阈值：<b>"+t+"</b><br>候选线数：<b>"+candidates.length+"</b>（黄线）"}
function boxSmooth(a,size){const r=(size-1)>>1,o=new Float32Array(a.length);let sum=0;for(let i=0;i<a.length;i++){sum+=a[Math.min(a.length-1,i+r)];if(i-r-1>=0)sum-=a[i-r-1];const lo=Math.max(0,i-r),hi=Math.min(a.length-1,i+r);o[i]=sum/(hi-lo+1)}return o}
function findCandidates(v,lo,hi,gap,count){const minima=[];for(let y=Math.max(1,lo);y<Math.min(v.length-1,hi);y++)if(v[y]<=v[y-1]&&v[y]<=v[y+1])minima.push({y,val:v[y]});minima.sort((a,b)=>a.val-b.val);const chosen=[];for(const p of minima){if(chosen.every(q=>Math.abs(p.y-q.y)>=gap))chosen.push(p);if(chosen.length>=count)break}return chosen.map(x=>x.y+bandStart)}
function drawGray(W,H,g){const c=$("grayCanvas");c.width=W;c.height=H;const out=new ImageData(W,H);for(let i=0,j=0;i<g.length;i++,j+=4)out.data[j]=out.data[j+1]=out.data[j+2]=g[i],out.data[j+3]=255;c.getContext("2d").putImageData(out,0,0)}
function drawBinary(W,H,b){const c=$("binaryCanvas");c.width=W;c.height=H;const out=new ImageData(W,H);for(let i=0,j=0;i<b.length;i++,j+=4)out.data[j]=out.data[j+1]=out.data[j+2]=b[i],out.data[j+3]=255;c.getContext("2d").putImageData(out,0,0)}
function drawProjection(p,lo,hi,center,ybase){const can=$("projection"),dpr=devicePixelRatio||1,w=can.clientWidth,h=can.clientHeight;can.width=w*dpr;can.height=h*dpr;const c=can.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);const pad={l:44,r:15,t:20,b:27},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b,max=Math.max(.02,...p);c.strokeStyle="#25354c";c.fillStyle="#9babc2";c.font="11px sans-serif";for(let i=0;i<=4;i++){const yy=pad.t+ph*i/4;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillText((max*(1-i/4)).toFixed(2),6,yy+4)}c.fillStyle="rgba(255,65,80,.13)";c.fillRect(pad.l+pw*lo/(p.length-1),pad.t,pw*(hi-lo)/(p.length-1),ph);c.beginPath();p.forEach((v,i)=>{const x=pad.l+pw*i/(p.length-1),y=pad.t+ph*(1-v/max);if(i===0)c.moveTo(x,y);else c.lineTo(x,y)});c.strokeStyle="#4bd9df";c.lineWidth=1.5;c.stroke();const cy=pad.t+ph*(1-p[clamp(center,0,p.length-1)]/max);c.strokeStyle="#ff5364";c.setLineDash([5,4]);c.beginPath();c.moveTo(pad.l,cy);c.lineTo(w-pad.r,cy);c.stroke();c.setLineDash([]);for(const absY of candidates){const i=clamp(absY-ybase,0,p.length-1),x=pad.l+pw*i/(p.length-1),yy=pad.t+ph*(1-p[i]/max);c.fillStyle="#ffc34d";c.beginPath();c.arc(x,yy,4,0,Math.PI*2);c.fill()}c.fillStyle="#9babc2";c.fillText("搜索带内 y： "+ybase+" – "+(ybase+p.length),pad.l,h-6);c.save();c.translate(12,pad.t+ph/2);c.rotate(-Math.PI/2);c.fillText("黑色像素比例",0,0);c.restore()}
$("target").addEventListener("input",()=>{$("target").dataset.manual="1"});window.addEventListener("resize",()=>{if(full){drawOriginal();analyze()}});})();
</script></body></html>
