<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画切片二值化实验台</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2d;--line:#283650;--muted:#9ba9c2;--text:#edf3ff;--cyan:#51d5dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17233a,var(--bg) 55%);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px max(20px,calc((100vw - 1440px)/2));border-bottom:1px solid var(--line)}h1{margin:0 0 5px;font-size:22px}header p{margin:0;color:var(--muted)}main{max-width:1440px;margin:auto;padding:20px;display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.controls{align-self:start;position:sticky;top:14px}.title{font-size:13px;font-weight:700;margin:1px 0 11px;color:#c9d7f0}.field{margin:12px 0}.field label{display:flex;justify-content:space-between;margin-bottom:5px;color:#c2cee2}.field input[type=number],.field select{width:100%;padding:9px;color:var(--text);background:#0c1424;border:1px solid var(--line);border-radius:8px}.field input[type=range]{width:100%;accent-color:var(--cyan)}button,.upload{border:1px solid #36506e;background:#1a2940;color:var(--text);padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:650}.upload{display:block;text-align:center;border-style:dashed;margin-bottom:9px}.primary{background:#087f89;border-color:#159da5;width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.methods{display:grid;grid-template-columns:1fr 1fr;gap:7px}.methods button{font-size:12px;padding:8px 5px}.methods button.active{outline:2px solid var(--cyan);background:#123d49}.stats{padding:10px;border-radius:9px;background:#0d1525;color:#bfd0e7;font-size:12px;margin-top:10px}.notice{margin-top:12px;padding:10px;border-left:3px solid #e6aa4c;background:#211e1a;color:#dacbac;font-size:12px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.view{background:#0b1220;border:1px solid var(--line);border-radius:12px;overflow:hidden}.viewhead{padding:10px 12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700}.viewhead small{font-weight:400;color:var(--muted)}.canvaswrap{max-height:78vh;overflow:auto;padding:12px;display:flex;justify-content:center;align-items:flex-start;background:#0e1726;position:relative}.canvaswrap canvas{display:block;max-width:100%;height:auto;box-shadow:0 5px 25px #0008}.empty{padding:46px 15px;text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.cell label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.cell canvas{width:100%;height:auto;image-rendering:pixelated;border:1px solid #263650;background:#fff}.cell.wide{grid-column:1/-1}.cell.wide canvas{max-height:220px;object-fit:contain;object-position:top}
@media(max-width:1080px){main{grid-template-columns:290px 1fr}.workspace{grid-template-columns:1fr}.controls{position:static}}@media(max-width:680px){main{display:flex;flex-direction:column;padding:12px}.cell.wide{grid-column:auto}}
</style></head><body>
<header><h1>漫画切片 · 二值化实验台</h1><p>按顺序纵向拼接图片，查看宽度推导的切线搜索范围，并比较不同方法提取疑似笔画的效果。</p></header>
<main><aside class="panel controls"><div class="title">01 / 图片与拼接</div>
<label class="upload" for="files">选择多张图片（可多选）</label><input id="files" type="file" accept="image/*" multiple hidden>
<div class="field"><label>拼接宽度 W（像素）</label><input id="width" type="number" min="1" value="720"></div>
<div class="field"><label>图片顺序</label><select id="order"><option value="name">按文件名数字排序</option><option value="select">按选择顺序</option></select></div><button id="rebuild" class="primary">拼接 / 更新预览</button><div id="imageStats" class="stats">尚未载入图片</div>
<hr style="border:0;border-top:1px solid #283650;margin:17px 0"><div class="title">02 / 候选切线搜索范围</div>
<div class="field"><label>理论高度 H₀ = 系数 × W</label><input id="factor" type="number" step=".01" value="3.46"></div>
<div class="field"><label>搜索半径 R = W 的指数次方</label><div class="row"><input id="exponent" type="number" step=".01" value=".86"><input id="scale" type="number" step=".05" value="1" title="半径倍率"></div><small style="color:#9ba9c2">指数；半径倍率（调试用）</small></div>
<div class="field"><label>切线中心 y <span id="targetLabel">—</span></label><input id="target" type="range" min="0" max="100" value="0"></div><div id="rangeStats" class="stats">拼接后显示范围</div>
<hr style="border:0;border-top:1px solid #283650;margin:17px 0"><div class="title">03 / 二值化与辅助方法</div>
<div class="methods" id="methods"><button data-m="gray" class="active">灰度原图</button><button data-m="fixed">固定阈值</button><button data-m="otsu">全局大津 Otsu</button><button data-m="adaptive">局部均值</button><button data-m="gaussian">高斯加权局部</button><button data-m="sauvola">Sauvola</button><button data-m="color">颜色差异增强</button><button data-m="edge">边缘强度</button></div>
<div class="field"><label>阈值 / 局部偏置 <span id="thLabel">128</span></label><input id="threshold" type="range" min="0" max="255" value="128"></div>
<div class="field"><label>局部窗口边长 <span id="winLabel">31</span></label><input id="window" type="range" min="9" max="81" step="2" value="31"></div>
<div class="field"><label>Sauvola k <span id="kLabel">0.20</span></label><input id="k" type="range" min=".05" max=".50" step=".01" value=".20"></div>
<div class="notice"><b>怎么看：</b>二值图只是找切线的分析信号，不是送给 OCR 的最终图。关注搜索带内文字笔画是否漏检，以及网点、背景纹理是否造成误报。</div></aside>
<section class="workspace"><div class="view"><div class="viewhead">拼接原图 <small id="sourceMeta">等待图片</small></div><div class="canvaswrap" id="stitchedWrap"><div class="empty">选择图片后按顺序纵向拼接</div><canvas id="stitched" hidden></canvas></div></div>
<div class="view"><div class="viewhead">候选带局部分析 <small id="cropMeta">尚无区域</small></div><div class="canvaswrap"><div class="empty" id="cropEmpty">拼接后显示搜索带</div><canvas id="crop" hidden></canvas></div><div class="grid"><div class="cell"><label>源区域（灰度）</label><canvas id="original"></canvas></div><div class="cell"><label id="resultLabel">处理结果</label><canvas id="result"></canvas></div><div class="cell wide"><label>并排预览：原灰度 / 当前方法</label><canvas id="compare"></canvas></div></div></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);let imgs=[],method="gray",full=null,bandY0=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),files=$("files"),stitched=$("stitched"),crop=$("crop");
files.onchange=async()=>{imgs=[];for(const f of files.files){try{imgs.push({f,b:await createImageBitmap(f)})}catch{}}$("imageStats").textContent="载入 "+imgs.length+" 张图片";rebuild()};$("rebuild").onclick=rebuild;$("order").onchange=rebuild;$("width").onchange=rebuild;
for(const id of ["factor","exponent","scale","target","threshold","window","k"])$(id).addEventListener("input",()=>{if(id==="target")$("target").dataset.manual="1";range();if(["threshold","window","k"].includes(id))render()});
$("methods").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;method=b.dataset.m;document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("active",x===b));render()};
function rebuild(){if(!imgs.length)return;const W=Math.max(1,+$("width").value||720),list=[...imgs];if($("order").value==="name")list.sort((a,b)=>a.f.name.localeCompare(b.f.name,undefined,{numeric:true,sensitivity:"base"}));let H=0;const hs=list.map(x=>{const h=Math.round(x.b.height*W/x.b.width);H+=h;return h});stitched.width=W;stitched.height=H;const c=stitched.getContext("2d",{willReadFrequently:true});let y=0;list.forEach((x,i)=>{c.drawImage(x.b,0,y,W,hs[i]);y+=hs[i]});full=c.getImageData(0,0,W,H);stitched.hidden=false;$("stitchedWrap").querySelector(".empty")?.remove();$("sourceMeta").textContent=W+" × "+H+"px";$("target").max=H-1;$("target").value=Math.min(H-1,Math.round(W*(+$("factor").value||3.46)));$("target").dataset.manual="";$("imageStats").innerHTML="<b>"+list.length+"</b> 张 · 拼接尺寸 <b>"+W+"×"+H+"</b> px<br>"+list.map((x,i)=>(i+1)+". "+x.f.name).join("<br>");range()}
function gray(im){const d=im.data,o=new Uint8Array(im.width*im.height);for(let i=0,j=0;i<o.length;i++,j+=4)o[i]=.299*d[j]+.587*d[j+1]+.114*d[j+2];return o}
function range(){if(!full)return;const W=full.width,H=full.height,h0=(+$("factor").value||3.46)*W,R=Math.pow(W,+$("exponent").value||.86)*(+$("scale").value||0),y=$("target").dataset.manual?(+$("target").value):Math.min(H-1,Math.round(h0));$("target").value=y;$("targetLabel").textContent=y+"px";$("rangeStats").innerHTML="H₀ = <b>"+h0.toFixed(1)+"px</b><br>R = <b>"+R.toFixed(1)+"px</b><br>候选线范围：<b>"+Math.max(0,y-R).toFixed(0)+" – "+Math.min(H-1,y+R).toFixed(0)+"px</b>";bandY0=Math.max(0,Math.floor(y-R));const y1=Math.min(H,Math.ceil(y+R)),bh=Math.max(1,y1-bandY0);crop.width=W;crop.height=bh;crop.getContext("2d").putImageData(new ImageData(full.data.slice(bandY0*W*4,y1*W*4),W,bh),0,0);crop.hidden=false;$("cropEmpty").hidden=true;$("cropMeta").textContent="y "+bandY0+"–"+y1+" · "+W+"×"+bh;drawBand(y,R);render()}
function drawBand(y,R){const wrap=$("stitchedWrap"),rect=stitched.getBoundingClientRect(),wr=wrap.getBoundingClientRect();let o=$("overlay");if(!o){o=document.createElement("canvas");o.id="overlay";o.style.cssText="position:absolute;pointer-events:none";wrap.append(o)}if(!rect.width)return;o.width=stitched.clientWidth*devicePixelRatio;o.height=stitched.clientHeight*devicePixelRatio;o.style.width=stitched.clientWidth+"px";o.style.height=stitched.clientHeight+"px";o.style.left=(rect.left-wr.left+wrap.scrollLeft)+"px";o.style.top=(rect.top-wr.top+wrap.scrollTop)+"px";const c=o.getContext("2d");c.scale(devicePixelRatio,devicePixelRatio);const s=stitched.clientHeight/stitched.height,top=clamp((y-R)*s,0,stitched.clientHeight),bot=clamp((y+R)*s,0,stitched.clientHeight);c.fillStyle="rgba(255,55,75,.24)";c.fillRect(0,top,stitched.clientWidth,bot-top);c.strokeStyle="#ff5364";c.lineWidth=2;c.beginPath();c.moveTo(0,y*s);c.lineTo(stitched.clientWidth,y*s);c.stroke();c.fillStyle="#ff5364";c.font="bold 12px sans-serif";c.fillText("目标 y="+y+"px",6,Math.max(14,y*s-5))}
function render(){if(!crop.width||!full)return;const W=crop.width,H=crop.height,N=W*H,src=crop.getContext("2d",{willReadFrequently:true}).getImageData(0,0,W,H),g=gray(src),t=+$("threshold").value,win=+$("window").value,k=+$("k").value;$("thLabel").textContent=t;$("winLabel").textContent=win;$("kLabel").textContent=k.toFixed(2);let ts=null,ot=0;if(method==="otsu")ot=otsu(g);if(["adaptive","sauvola"].includes(method))ts=local(g,W,H,win,method,t,k);if(method==="gaussian")ts=gaussianThreshold(g,W,H,win,t);const out=new ImageData(W,H),d=out.data;
for(let i=0,j=0;i<N;i++,j+=4){const v=g[i];let q=v;if(method==="color"){const hi=Math.max(src.data[j],src.data[j+1],src.data[j+2]),lo=Math.min(src.data[j],src.data[j+1],src.data[j+2]),sat=hi?(hi-lo)/hi:0;q=clamp(v*(1-.72*sat),0,255)}else if(method==="edge"){const x=i%W,y=(i/W)|0,gx=(x?g[i-1]:v)-(x<W-1?g[i+1]:v),gy=(y?g[i-W]:v)-(y<H-1?g[i+W]:v);q=clamp(Math.hypot(gx,gy)*2,0,255)}else if(method!=="gray"){const th=method==="fixed"?t:method==="otsu"?ot:ts[i];q=v<th?0:255}d[j]=d[j+1]=d[j+2]=q;d[j+3]=255}
$("result").width=W;$("result").height=H;$("result").getContext("2d").putImageData(out,0,0);const og=new ImageData(W,H);for(let i=0,j=0;i<N;i++,j+=4)og.data[j]=og.data[j+1]=og.data[j+2]=g[i],og.data[j+3]=255;$("original").width=W;$("original").height=H;$("original").getContext("2d").putImageData(og,0,0);const cc=$("compare"),half=Math.ceil(W/2);cc.width=W;cc.height=H;const ctx=cc.getContext("2d");ctx.drawImage($("original"),0,0,half,H);ctx.drawImage($("result"),half,0,W-half,H);$("resultLabel").textContent=({gray:"灰度原图",fixed:"固定阈值",otsu:"全局大津 Otsu (T="+ot+")",adaptive:"局部均值阈值",gaussian:"高斯加权局部阈值",sauvola:"Sauvola 局部阈值",color:"颜色差异增强",edge:"边缘强度"})[method]}
function otsu(g){const h=new Uint32Array(256);for(const v of g)h[v]++;let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];let wb=0,sb=0,best=-1,t=128,n=g.length;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];const d=sb/wb-(sum-sb)/wf,s=wb*wf*d*d;if(s>best)best=s,t=i}return t}
function gaussianThreshold(g,W,H,win,bias){const r=win>>1,sigma=Math.max(1,win/6),weights=[];let total=0;for(let i=-r;i<=r;i++){const w=Math.exp(-(i*i)/(2*sigma*sigma));weights.push(w);total+=w}for(let i=0;i<weights.length;i++)weights[i]/=total;const tmp=new Float32Array(W*H),out=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let k=-r;k<=r;k++)v+=g[y*W+clamp(x+k,0,W-1)]*weights[k+r];tmp[y*W+x]=v}for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let k=-r;k<=r;k++)v+=tmp[clamp(y+k,0,H-1)*W+x]*weights[k+r];out[y*W+x]=v+(bias-128)*.45}return out}
function local(g,W,H,win,kind,bias,k){const st=W+1,I=new Float64Array((H+1)*st),Q=kind==="sauvola"?new Float64Array((H+1)*st):null;for(let y=1;y<=H;y++){let row=0,rq=0;for(let x=1;x<=W;x++){const v=g[(y-1)*W+x-1];row+=v;if(Q)rq+=v*v;const z=y*st+x;I[z]=I[z-st]+row;if(Q)Q[z]=Q[z-st]+rq}}const out=new Uint8Array(W*H),r=win>>1;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ya=Math.max(0,y-r),yb=Math.min(H-1,y+r),xa=Math.max(0,x-r),xb=Math.min(W-1,x+r),a=ya*st+xa,b=ya*st+xb+1,c=(yb+1)*st+xa,d=(yb+1)*st+xb+1,n=(yb-ya+1)*(xb-xa+1),mean=(I[d]-I[b]-I[c]+I[a])/n;let th;if(kind==="sauvola"){const sd=Math.sqrt(Math.max(0,(Q[d]-Q[b]-Q[c]+Q[a])/n-mean*mean));th=mean*(1+k*(sd/128-1))}else if(kind==="gaussian"){const center=g[y*W+x];th=mean-4+(center-mean)*.035}else th=mean+(bias-128)*.45;out[y*W+x]=th}return out}
$("target").addEventListener("input",()=>{$("target").dataset.manual="1"});window.addEventListener("resize",()=>{if(full)range()});$("stitchedWrap").addEventListener("scroll",()=>{if(full)drawBand(+$("target").value,Math.pow(full.width,+$("exponent").value||.86)*(+$("scale").value||0))});
})();
</script></body></html>
