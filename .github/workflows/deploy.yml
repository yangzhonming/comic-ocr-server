name: Build and Push Comic OCR to Aliyun ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx (支持多层高速缓存)
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务 (ACR 深圳个人版)
        uses: docker/login-action@v3
        with:
          registry: crpi-adr7aw7fhazomgpo.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: 高性能构建并推送镜像至阿里云
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            crpi-adr7aw7fhazomgpo.cn-shenzhen.personal.cr.aliyuncs.com/byd123/comic:v2
            crpi-adr7aw7fhazomgpo.cn-shenzhen.personal.cr.aliyuncs.com/byd123/comic:latest
          # 启用 GitHub Actions 官方免费层级缓存 (极速秒级构建)
          cache-from: type=gha
          cache-to: type=gha,mode=max
